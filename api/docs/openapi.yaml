openapi: 3.0.3
info:
  title: MiniAula API
  version: 0.1.0
  description: |
    API REST de MiniAula (Proyecto final Ingeniería Web 2).

    - Todas las respuestas son JSON.
    - Errores con formato único: `{ "error": { "status", "code", "message", "details", "requestId", "timestamp" } }`.
    - Listados paginados: `{ "data": [...], "meta": { "page", "limit", "total", "totalPages" } }`.
    - Cada respuesta incluye el header `X-Request-Id` para rastrear la solicitud en los logs.

    Los endpoints de dominio (auth, cursos, lecciones, etc.) se agregan en cada paso;
    ver `docs/api/endpoints.md` en el repositorio para el estado de cada uno.
servers:
  - url: /api
    description: Mismo origen que esta documentación
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Auth
    description: |
      Registro e inicio de sesión. Devuelven un JWT (HS256, payload `{ id, rol }`) que se envía como
      `Authorization: Bearer <token>` y expira según `JWT_EXPIRES_IN` (2 h por defecto).

      **Cerrar sesión:** la API es stateless; el cliente borra su token (no hay endpoint de logout).
  - name: Usuarios
    description: Perfil del usuario autenticado
  - name: Cursos
    description: Catálogo público y gestión de cursos
  - name: Instructor
    description: Gestión de cursos y contenidos para instructores
  - name: Lecciones
    description: |
      Temario del curso (solo el instructor dueño). El `orden` va de 1 a n sin huecos: crear agrega al final,
      borrar recompacta y reordenar recibe la lista completa. El tipo de una lección no se puede cambiar.
  - name: Preguntas
    description: |
      Preguntas de opción múltiple de un cuestionario (solo el instructor dueño). Las respuestas incluyen
      `indiceCorrecto` porque son del editor; ningún endpoint de estudiante lo devuelve (RN-02).
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado de la API y de la conexión a la base de datos
      operationId: getHealth
      responses:
        '200':
          description: API y base de datos operativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: up
                uptime: 42
                timestamp: '2026-11-03T12:00:00.000Z'
        '503':
          description: API operativa pero sin conexión a la base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: down
                uptime: 42
                timestamp: '2026-11-03T12:00:00.000Z'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario con rol
      description: El email se guarda recortado y en minúsculas. Devuelve el usuario creado y su token.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Ana Pérez
              email: ana@miniaula.com
              password: Password123!
              rol: estudiante
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe una cuenta con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 409
                  code: EMAIL_TAKEN
                  message: Ya existe una cuenta con ese email
                  details:
                    - location: body
                      field: email
                      message: Ya existe una cuenta con ese email
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Credenciales incorrectas → 401 `INVALID_CREDENTIALS` genérico (no revela si el email existe).
        Máximo 5 intentos **fallidos** por minuto e IP: el siguiente responde 429 con el header `Retry-After`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: estudiante1@miniaula.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 401
                  code: INVALID_CREDENTIALS
                  message: Email o contraseña incorrectos
                  details: null
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Usuarios]
      summary: Editar el perfil propio
      description: |
        Actualiza nombre, email y/o contraseña; hay que enviar al menos uno. Para cambiar la contraseña se exige
        `passwordActual` (422 `INVALID_CURRENT_PASSWORD` si no coincide). El `rol` no es editable: se ignora.
        Devuelve el usuario actualizado. El token sigue siendo válido (solo contiene `id` y `rol`).
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              datos:
                summary: Cambiar nombre y email
                value:
                  nombre: Juan Estudiante
                  email: juan@miniaula.com
              password:
                summary: Cambiar la contraseña
                value:
                  passwordActual: Password123!
                  password: NuevaClave456!
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El email ya pertenece a otra cuenta (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Falla de validación o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 422
                  code: INVALID_CURRENT_PASSWORD
                  message: La contraseña actual no es correcta
                  details:
                    - location: body
                      field: passwordActual
                      message: La contraseña actual no es correcta
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /cursos:
    get:
      tags: [Cursos]
      summary: Catálogo público de cursos publicados
      operationId: getCursosCatalogo
      parameters:
        - name: q
          in: query
          description: Búsqueda por texto en título (case-insensitive)
          schema:
            type: string
        - name: categoria
          in: query
          description: Filtro exacto por categoría
          schema:
            type: string
        - name: nivel
          in: query
          schema:
            $ref: '#/components/schemas/NivelCurso'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Listado paginado de cursos publicados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCursosResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Cursos]
      summary: Crear un nuevo curso (solo instructor, nace en estado borrador)
      operationId: createCurso
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCursoRequest'
      responses:
        '201':
          description: Curso creado exitosamente en estado borrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /cursos/{id}:
    get:
      tags: [Cursos]
      summary: Detalle público de un curso publicado con temario resumido
      operationId: getCursoDetallePublico
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detalle del curso y lista de lecciones sin contenido sensible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CursoPublicoDetalle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Cursos]
      summary: Actualizar curso (solo instructor dueño)
      operationId: updateCurso
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCursoRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Cursos]
      summary: Eliminar curso (solo instructor dueño, 409 si tiene estudiantes inscritos)
      operationId: deleteCurso
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Curso eliminado exitosamente
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: El curso no puede eliminarse porque tiene inscritos (COURSE_HAS_STUDENTS)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /cursos/{id}/estado:
    patch:
      tags: [Cursos]
      summary: Cambiar estado del curso (solo instructor dueño; 422 si se publica sin lecciones)
      operationId: changeCursoEstado
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEstadoRequest'
      responses:
        '200':
          description: Estado del curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Curso'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            No se puede publicar: el curso no tiene lecciones (`COURSE_CANNOT_PUBLISH_EMPTY`) o tiene
            cuestionarios sin preguntas (`QUIZ_WITHOUT_QUESTIONS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /cursos/{id}/lecciones:
    post:
      tags: [Lecciones]
      summary: Crear lección al final del temario (orden = último + 1)
      operationId: createLeccion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeccionRequest'
            examples:
              contenido:
                summary: Lección de contenido
                value:
                  tipo: contenido
                  titulo: Variables y tipos de datos
                  contenido: En JavaScript las variables se declaran con let y const...
                  videoUrl: https://www.youtube.com/watch?v=dQw4w9WgXcQ
              cuestionario:
                summary: Cuestionario
                value:
                  tipo: cuestionario
                  titulo: Evaluación del módulo 1
                  notaMinima: 70
      responses:
        '201':
          description: Lección creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leccion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validación (`VALIDATION_ERROR`) o el curso llegó al máximo de 50 lecciones (`LESSON_LIMIT_REACHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /cursos/{id}/lecciones/orden:
    patch:
      tags: [Lecciones]
      summary: Reordenar el temario completo (en una transacción)
      operationId: reorderLecciones
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReordenarLeccionesRequest'
      responses:
        '200':
          description: Lecciones del curso en el orden nuevo (sin preguntas)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leccion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: |
            Validación (`VALIDATION_ERROR`, p. ej. ids repetidos) o la lista no contiene exactamente todas
            las lecciones del curso (`LESSON_ORDER_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 422
                  code: LESSON_ORDER_MISMATCH
                  message: La lista debe incluir exactamente todas las lecciones del curso. Recarga la página e inténtalo de nuevo.
                  details: null
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-09T12:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
  /lecciones/{id}:
    put:
      tags: [Lecciones]
      summary: Editar lección (al menos un campo; el tipo no se edita)
      operationId: updateLeccion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeccionRequest'
      responses:
        '200':
          description: Lección actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leccion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La lección no existe (`LESSON_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Validación (`VALIDATION_ERROR`), incluido `notaMinima` en una lección de contenido o `videoUrl`
            en un cuestionario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Lecciones]
      summary: Eliminar lección y recompactar el orden
      operationId: deleteLeccion
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Lección eliminada (sus preguntas, progresos e intentos se borran en cascada)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La lección no existe (`LESSON_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El curso tiene estudiantes inscritos (`COURSE_HAS_STUDENTS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Es la última lección de un curso publicado (`PUBLISHED_COURSE_NEEDS_LESSON`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /lecciones/{id}/preguntas:
    post:
      tags: [Preguntas]
      summary: Crear pregunta de opción múltiple en un cuestionario
      operationId: createPregunta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaRequest'
      responses:
        '201':
          description: Pregunta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreguntaEditor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La lección no existe (`LESSON_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            Validación (`VALIDATION_ERROR`), la lección no es un cuestionario (`LESSON_NOT_QUIZ`) o llegó al
            máximo de 30 preguntas (`QUESTION_LIMIT_REACHED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /preguntas/{id}:
    put:
      tags: [Preguntas]
      summary: Reemplazar la pregunta completa
      operationId: updatePregunta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreguntaRequest'
      responses:
        '200':
          description: Pregunta actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreguntaEditor'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La pregunta no existe (`QUESTION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Preguntas]
      summary: Eliminar pregunta
      operationId: deletePregunta
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Pregunta eliminada
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La pregunta no existe (`QUESTION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Es la última pregunta de un cuestionario de un curso publicado (`QUIZ_WITHOUT_QUESTIONS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /instructor/cursos:
    get:
      tags: [Instructor]
      summary: Listar mis cursos como instructor con conteo de lecciones e inscritos
      operationId: getInstructorCursos
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/LimitQuery'
      responses:
        '200':
          description: Listado paginado de cursos del instructor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInstructorCursosResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /instructor/cursos/{id}:
    get:
      tags: [Instructor]
      summary: Detalle completo del curso para edición (con lecciones y preguntas con respuestas correctas)
      operationId: getInstructorCursoDetalle
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          description: Detalle del curso para el editor del instructor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorCursoDetalle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Identificador único de la solicitud
      schema:
        type: string
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 9
  schemas:
    Health:
      type: object
      required: [status, database, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        uptime:
          type: integer
          description: Segundos desde que arrancó el proceso
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      properties:
        location:
          type: string
          enum: [params, query, body]
        field:
          type: string
          nullable: true
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message, details, requestId, timestamp]
          properties:
            status:
              type: integer
              description: Código HTTP (el mismo de la respuesta)
              example: 422
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              description: Mensaje legible para el usuario final (genérico en los 5xx)
              example: Los datos enviados no son válidos
            details:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: Mismo valor que el header X-Request-Id; ubica la solicitud en los logs
              example: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
            timestamp:
              type: string
              format: date-time
              example: '2026-11-07T12:00:00.000Z'
    Rol:
      type: string
      enum: [estudiante, instructor]
    Usuario:
      type: object
      description: Usuario público (nunca incluye `passwordHash`)
      required: [id, nombre, email, rol, createdAt]
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@miniaula.com
        rol:
          $ref: '#/components/schemas/Rol'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-07T12:00:00.000Z'
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/Usuario'
        token:
          type: string
          description: JWT HS256 con payload `{ id, rol }`
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NCwicm9sIjoiZXN0dWRpYW50ZSJ9.firma
    RegisterRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        rol:
          $ref: '#/components/schemas/Rol'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateMeRequest:
      type: object
      description: Al menos uno de `nombre`, `email` o `password`. `passwordActual` es obligatorio si se envía `password`.
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Nueva contraseña
        passwordActual:
          type: string
          format: password
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 9
        total:
          type: integer
          example: 23
        totalPages:
          type: integer
          example: 3
    NivelCurso:
      type: string
      enum: [principiante, intermedio, avanzado]
    EstadoCurso:
      type: string
      enum: [borrador, publicado, archivado]
    Curso:
      type: object
      required: [id, instructorId, titulo, categoria, nivel, estado, createdAt, updatedAt]
      properties:
        id:
          type: integer
          example: 1
        instructorId:
          type: integer
          example: 2
        titulo:
          type: string
          example: Desarrollo Web con Node.js y Express
        descripcion:
          type: string
          nullable: true
          example: Aprende a construir APIs REST seguras y escalables desde cero.
        categoria:
          type: string
          example: Programación
        nivel:
          $ref: '#/components/schemas/NivelCurso'
        estado:
          $ref: '#/components/schemas/EstadoCurso'
        imagenUrl:
          type: string
          nullable: true
          format: uri
          example: https://images.unsplash.com/photo-1517694712202-14dd9538aa97
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateCursoRequest:
      type: object
      required: [titulo, categoria, nivel]
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
          example: Introducción a Docker
        descripcion:
          type: string
          maxLength: 5000
          nullable: true
          example: Contenedores paso a paso.
        categoria:
          type: string
          minLength: 2
          maxLength: 100
          example: DevOps
        nivel:
          $ref: '#/components/schemas/NivelCurso'
        imagenUrl:
          type: string
          format: uri
          nullable: true
    UpdateCursoRequest:
      type: object
      minProperties: 1
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        descripcion:
          type: string
          maxLength: 5000
          nullable: true
        categoria:
          type: string
          minLength: 2
          maxLength: 100
        nivel:
          $ref: '#/components/schemas/NivelCurso'
        imagenUrl:
          type: string
          format: uri
          nullable: true
    ChangeEstadoRequest:
      type: object
      required: [estado]
      properties:
        estado:
          $ref: '#/components/schemas/EstadoCurso'
    CursoPublicoListado:
      type: object
      required: [id, instructorId, titulo, categoria, nivel, estado, totalLecciones, instructor, createdAt]
      properties:
        id:
          type: integer
        instructorId:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        categoria:
          type: string
        nivel:
          $ref: '#/components/schemas/NivelCurso'
        estado:
          $ref: '#/components/schemas/EstadoCurso'
        imagenUrl:
          type: string
          nullable: true
        totalLecciones:
          type: integer
          example: 5
        instructor:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: integer
            nombre:
              type: string
        createdAt:
          type: string
          format: date-time
    CursoPublicoDetalle:
      type: object
      required: [id, instructorId, titulo, categoria, nivel, estado, instructor, lecciones, createdAt]
      properties:
        id:
          type: integer
        instructorId:
          type: integer
        titulo:
          type: string
        descripcion:
          type: string
          nullable: true
        categoria:
          type: string
        nivel:
          $ref: '#/components/schemas/NivelCurso'
        estado:
          $ref: '#/components/schemas/EstadoCurso'
        imagenUrl:
          type: string
          nullable: true
        instructor:
          type: object
          required: [id, nombre]
          properties:
            id:
              type: integer
            nombre:
              type: string
        lecciones:
          type: array
          items:
            type: object
            required: [id, titulo, tipo, orden]
            properties:
              id:
                type: integer
              titulo:
                type: string
              tipo:
                type: string
                enum: [contenido, cuestionario]
              orden:
                type: integer
        createdAt:
          type: string
          format: date-time
    InstructorCursoItem:
      allOf:
        - $ref: '#/components/schemas/Curso'
        - type: object
          required: [totalLecciones, totalInscritos]
          properties:
            totalLecciones:
              type: integer
              example: 5
            totalInscritos:
              type: integer
              example: 12
    InstructorCursoDetalle:
      allOf:
        - $ref: '#/components/schemas/Curso'
        - type: object
          required: [lecciones]
          properties:
            lecciones:
              type: array
              items:
                allOf:
                  - $ref: '#/components/schemas/Leccion'
                  - type: object
                    required: [preguntas]
                    properties:
                      preguntas:
                        type: array
                        items:
                          $ref: '#/components/schemas/PreguntaEditor'
    TipoLeccion:
      type: string
      enum: [contenido, cuestionario]
    Leccion:
      type: object
      required: [id, cursoId, titulo, tipo, orden]
      properties:
        id:
          type: integer
          example: 4
        cursoId:
          type: integer
          example: 1
        titulo:
          type: string
          example: Variables y tipos de datos
        contenido:
          type: string
          nullable: true
          description: Texto de la lección (en cuestionarios, instrucciones opcionales)
        videoUrl:
          type: string
          format: uri
          nullable: true
          description: Solo lecciones de contenido
        tipo:
          $ref: '#/components/schemas/TipoLeccion'
        orden:
          type: integer
          minimum: 1
          example: 2
        notaMinima:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
          description: Solo cuestionarios
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateLeccionContenidoRequest:
      type: object
      required: [tipo, titulo]
      properties:
        tipo:
          type: string
          enum: [contenido]
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        contenido:
          type: string
          maxLength: 20000
          nullable: true
        videoUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          description: http(s); vacío se guarda como null
    CreateLeccionCuestionarioRequest:
      type: object
      required: [tipo, titulo, notaMinima]
      properties:
        tipo:
          type: string
          enum: [cuestionario]
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        contenido:
          type: string
          maxLength: 20000
          nullable: true
          description: Instrucciones opcionales
        notaMinima:
          type: integer
          minimum: 0
          maximum: 100
    CreateLeccionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateLeccionContenidoRequest'
        - $ref: '#/components/schemas/CreateLeccionCuestionarioRequest'
      discriminator:
        propertyName: tipo
        mapping:
          contenido: '#/components/schemas/CreateLeccionContenidoRequest'
          cuestionario: '#/components/schemas/CreateLeccionCuestionarioRequest'
    UpdateLeccionRequest:
      type: object
      minProperties: 1
      description: Al menos un campo. `videoUrl` solo aplica a contenido y `notaMinima` solo a cuestionarios.
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        contenido:
          type: string
          maxLength: 20000
          nullable: true
        videoUrl:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        notaMinima:
          type: integer
          minimum: 0
          maximum: 100
    ReordenarLeccionesRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Todas las lecciones del curso, sin repetir, en el orden nuevo
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: integer
          example: [6, 4, 5]
    PreguntaEditor:
      type: object
      description: Pregunta para el editor del instructor dueño (incluye la respuesta correcta)
      required: [id, leccionId, enunciado, opciones, indiceCorrecto]
      properties:
        id:
          type: integer
        leccionId:
          type: integer
        enunciado:
          type: string
          example: ¿Qué palabra clave declara una constante?
        opciones:
          type: array
          items:
            type: string
          example: [var, let, const]
        indiceCorrecto:
          type: integer
          example: 2
        explicacion:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PreguntaRequest:
      type: object
      required: [enunciado, opciones, indiceCorrecto]
      properties:
        enunciado:
          type: string
          minLength: 3
          maxLength: 1000
        opciones:
          type: array
          description: Entre 2 y 6 textos no vacíos (hasta 300 caracteres) sin repetir
          minItems: 2
          maxItems: 6
          items:
            type: string
            maxLength: 300
        indiceCorrecto:
          type: integer
          minimum: 0
          description: Índice dentro de `opciones`
        explicacion:
          type: string
          maxLength: 2000
          nullable: true
      example:
        enunciado: ¿Qué palabra clave declara una constante?
        opciones: [var, let, const]
        indiceCorrecto: 2
        explicacion: const impide reasignar la variable.
    PaginatedCursosResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CursoPublicoListado'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
    PaginatedInstructorCursosResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InstructorCursoItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
  responses:
    BadRequest:
      description: JSON mal formado o parámetros/query inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 400
              code: BAD_REQUEST
              message: Parámetros de la solicitud inválidos
              details:
                - location: query
                  field: limit
                  message: 'Demasiado grande: se esperaba que número fuera <=50'
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Unauthorized:
      description: |
        Sin token (`UNAUTHORIZED`), token inválido o de un usuario que ya no existe (`INVALID_TOKEN`)
        o token expirado (`TOKEN_EXPIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 401
              code: TOKEN_EXPIRED
              message: Tu sesión expiró. Inicia sesión nuevamente.
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Forbidden:
      description: Rol incorrecto o sin permiso sobre el recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso o ruta inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 404
              code: ROUTE_NOT_FOUND
              message: Ruta GET /api/noexiste no encontrada
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Conflict:
      description: Conflicto con el estado actual (duplicado, dependencias)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Falla de validación o regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Demasiados intentos; el header `Retry-After` indica los segundos de espera
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 429
              code: TOO_MANY_REQUESTS
              message: Demasiados intentos de inicio de sesión. Intenta de nuevo en 42 segundos.
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    InternalError:
      description: Error no controlado (sin stack en la respuesta)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 500
              code: INTERNAL_ERROR
              message: Error interno del servidor
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
