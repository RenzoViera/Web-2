openapi: 3.0.3
info:
  title: MiniAula API
  version: 0.1.0
  description: |
    API REST de MiniAula (Proyecto final Ingeniería Web 2).

    - Todas las respuestas son JSON.
    - Errores con formato único: `{ "error": { "status", "code", "message", "details", "requestId", "timestamp" } }`.
    - Listados paginados: `{ "data": [...], "meta": { "page", "limit", "total", "totalPages" } }`.
    - Cada respuesta incluye el header `X-Request-Id` para rastrear la solicitud en los logs.

    Los endpoints de dominio (auth, cursos, lecciones, etc.) se agregan en cada paso;
    ver `docs/api/endpoints.md` en el repositorio para el estado de cada uno.
servers:
  - url: /api
    description: Mismo origen que esta documentación
tags:
  - name: Sistema
    description: Estado del servicio
  - name: Auth
    description: |
      Registro e inicio de sesión. Devuelven un JWT (HS256, payload `{ id, rol }`) que se envía como
      `Authorization: Bearer <token>` y expira según `JWT_EXPIRES_IN` (2 h por defecto).

      **Cerrar sesión:** la API es stateless; el cliente borra su token (no hay endpoint de logout).
  - name: Usuarios
    description: Perfil del usuario autenticado
paths:
  /health:
    get:
      tags: [Sistema]
      summary: Estado de la API y de la conexión a la base de datos
      operationId: getHealth
      responses:
        '200':
          description: API y base de datos operativas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                database: up
                uptime: 42
                timestamp: '2026-11-03T12:00:00.000Z'
        '503':
          description: API operativa pero sin conexión a la base de datos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: degraded
                database: down
                uptime: 42
                timestamp: '2026-11-03T12:00:00.000Z'
  /auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario con rol
      description: El email se guarda recortado y en minúsculas. Devuelve el usuario creado y su token.
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Ana Pérez
              email: ana@miniaula.com
              password: Password123!
              rol: estudiante
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Ya existe una cuenta con ese email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 409
                  code: EMAIL_TAKEN
                  message: Ya existe una cuenta con ese email
                  details:
                    - location: body
                      field: email
                      message: Ya existe una cuenta con ese email
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: |
        Credenciales incorrectas → 401 `INVALID_CREDENTIALS` genérico (no revela si el email existe).
        Máximo 5 intentos **fallidos** por minuto e IP: el siguiente responde 429 con el header `Retry-After`.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: estudiante1@miniaula.com
              password: Password123!
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Email o contraseña incorrectos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 401
                  code: INVALID_CREDENTIALS
                  message: Email o contraseña incorrectos
                  details: null
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/me:
    get:
      tags: [Usuarios]
      summary: Perfil del usuario autenticado
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil propio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Usuarios]
      summary: Editar el perfil propio
      description: |
        Actualiza nombre, email y/o contraseña; hay que enviar al menos uno. Para cambiar la contraseña se exige
        `passwordActual` (422 `INVALID_CURRENT_PASSWORD` si no coincide). El `rol` no es editable: se ignora.
        Devuelve el usuario actualizado. El token sigue siendo válido (solo contiene `id` y `rol`).
      operationId: updateMe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            examples:
              datos:
                summary: Cambiar nombre y email
                value:
                  nombre: Juan Estudiante
                  email: juan@miniaula.com
              password:
                summary: Cambiar la contraseña
                value:
                  passwordActual: Password123!
                  password: NuevaClave456!
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: El email ya pertenece a otra cuenta (`EMAIL_TAKEN`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Falla de validación o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  status: 422
                  code: INVALID_CURRENT_PASSWORD
                  message: La contraseña actual no es correcta
                  details:
                    - location: body
                      field: passwordActual
                      message: La contraseña actual no es correcta
                  requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
                  timestamp: '2026-11-07T12:00:00.000Z'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    XRequestId:
      description: Identificador único de la solicitud
      schema:
        type: string
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 9
  schemas:
    Health:
      type: object
      required: [status, database, uptime, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
        uptime:
          type: integer
          description: Segundos desde que arrancó el proceso
        timestamp:
          type: string
          format: date-time
    ErrorDetail:
      type: object
      properties:
        location:
          type: string
          enum: [params, query, body]
        field:
          type: string
          nullable: true
        message:
          type: string
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [status, code, message, details, requestId, timestamp]
          properties:
            status:
              type: integer
              description: Código HTTP (el mismo de la respuesta)
              example: 422
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              description: Mensaje legible para el usuario final (genérico en los 5xx)
              example: Los datos enviados no son válidos
            details:
              type: array
              nullable: true
              items:
                $ref: '#/components/schemas/ErrorDetail'
            requestId:
              type: string
              description: Mismo valor que el header X-Request-Id; ubica la solicitud en los logs
              example: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
            timestamp:
              type: string
              format: date-time
              example: '2026-11-07T12:00:00.000Z'
    Rol:
      type: string
      enum: [estudiante, instructor]
    Usuario:
      type: object
      description: Usuario público (nunca incluye `passwordHash`)
      required: [id, nombre, email, rol, createdAt]
      properties:
        id:
          type: integer
          example: 4
        nombre:
          type: string
          example: Ana Pérez
        email:
          type: string
          format: email
          example: ana@miniaula.com
        rol:
          $ref: '#/components/schemas/Rol'
        createdAt:
          type: string
          format: date-time
          example: '2026-11-07T12:00:00.000Z'
    AuthResponse:
      type: object
      required: [user, token]
      properties:
        user:
          $ref: '#/components/schemas/Usuario'
        token:
          type: string
          description: JWT HS256 con payload `{ id, rol }`
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6NCwicm9sIjoiZXN0dWRpYW50ZSJ9.firma
    RegisterRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        rol:
          $ref: '#/components/schemas/Rol'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    UpdateMeRequest:
      type: object
      description: Al menos uno de `nombre`, `email` o `password`. `passwordActual` es obligatorio si se envía `password`.
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Nueva contraseña
        passwordActual:
          type: string
          format: password
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 9
        total:
          type: integer
          example: 23
        totalPages:
          type: integer
          example: 3
  responses:
    BadRequest:
      description: JSON mal formado o parámetros/query inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 400
              code: BAD_REQUEST
              message: Parámetros de la solicitud inválidos
              details:
                - location: query
                  field: limit
                  message: 'Demasiado grande: se esperaba que número fuera <=50'
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Unauthorized:
      description: |
        Sin token (`UNAUTHORIZED`), token inválido o de un usuario que ya no existe (`INVALID_TOKEN`)
        o token expirado (`TOKEN_EXPIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 401
              code: TOKEN_EXPIRED
              message: Tu sesión expiró. Inicia sesión nuevamente.
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Forbidden:
      description: Rol incorrecto o sin permiso sobre el recurso
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso o ruta inexistente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 404
              code: ROUTE_NOT_FOUND
              message: Ruta GET /api/noexiste no encontrada
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    Conflict:
      description: Conflicto con el estado actual (duplicado, dependencias)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Falla de validación o regla de negocio
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Demasiados intentos; el header `Retry-After` indica los segundos de espera
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 429
              code: TOO_MANY_REQUESTS
              message: Demasiados intentos de inicio de sesión. Intenta de nuevo en 42 segundos.
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
    InternalError:
      description: Error no controlado (sin stack en la respuesta)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              status: 500
              code: INTERNAL_ERROR
              message: Error interno del servidor
              details: null
              requestId: 3f1c2a9e-5b7d-4c1e-9a2f-8d6b4e0c1a7f
              timestamp: '2026-11-07T12:00:00.000Z'
